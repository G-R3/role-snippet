<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Role Snippet</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main id="popup" class="popup" data-page="reading" data-filing="ready">
      <header class="header">
        <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
          <path class="mark-corners" d="M1.75 5.25v-3.5h3.5M14.25 10.75v3.5h-3.5" />
          <path class="mark-line" d="M5 8h6" />
        </svg>
        <p id="status" class="status" role="status">
          <svg class="status-check" aria-hidden="true"><use href="./icons.svg#check" /></svg>
          <span id="status-message"></span>
        </p>
        <button
          id="reextract-button"
          class="icon-button"
          type="button"
          aria-label="Read the page again"
          title="Read the page again"
        >
          <svg aria-hidden="true"><use href="./icons.svg#refresh" /></svg>
        </button>
        <button id="file-again-button" class="text-button" type="button" hidden>
          File again
        </button>
        <div id="action" class="action">
          <a
            id="open-notion-link"
            class="primary-button"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open in Notion
            <svg aria-hidden="true"><use href="./icons.svg#external" /></svg>
          </a>
          <button
            id="add-to-notion-button"
            class="primary-button"
            type="submit"
            form="job-form"
            aria-keyshortcuts="Meta+Enter Control+Enter"
          >
            Add to Notion
            <span class="button-trail" aria-hidden="true">
              <span id="shortcut-hint" class="shortcut" data-platform="mac">
                <svg class="shortcut-mod" aria-hidden="true"><use href="./icons.svg#command" /></svg>
                <span class="shortcut-ctrl">Ctrl</span>
                <svg aria-hidden="true"><use href="./icons.svg#enter" /></svg>
              </span>
              <svg class="spinner" aria-hidden="true"><use href="./icons.svg#spinner" /></svg>
            </span>
          </button>
        </div>
      </header>

      <p id="page-notice" class="page-notice" hidden></p>

      <form id="job-form" class="ledger" novalidate>
        <div class="row">
          <label for="title-value">Role</label>
          <textarea
            id="title-value"
            class="value value-title"
            rows="1"
            spellcheck="false"
            placeholder="Role title"
            required
          ></textarea>
          <svg class="row-flag" aria-hidden="true"><use href="./icons.svg#flag" /></svg>
          <span id="title-warning" class="visually-hidden">Required. Add a role to file this job.</span>
        </div>

        <div class="row">
          <label for="company-value">Company</label>
          <input
            id="company-value"
            class="value"
            type="text"
            spellcheck="false"
            placeholder="Company"
            required
          />
          <svg class="row-flag" aria-hidden="true"><use href="./icons.svg#flag" /></svg>
          <span id="company-warning" class="visually-hidden">Required. Add a company to file this job.</span>
        </div>

        <div class="row">
          <label for="location-value">Location</label>
          <input
            id="location-value"
            class="value"
            type="text"
            spellcheck="false"
            placeholder="Location"
          />
        </div>

        <div class="row">
          <label for="url-value">Job URL</label>
          <input
            id="url-value"
            class="value"
            type="url"
            spellcheck="false"
            placeholder="https://"
          />
        </div>

        <div class="row">
          <label for="description-value">Description</label>
          <textarea
            id="description-value"
            class="value value-description"
            placeholder="Paste the job description"
            required
          ></textarea>
          <svg class="row-flag" aria-hidden="true"><use href="./icons.svg#flag" /></svg>
          <span id="description-warning" class="visually-hidden">Required. Add a description to file this job.</span>
        </div>

        <div class="row">
          <label for="notes-value">Notes</label>
          <textarea
            id="notes-value"
            class="value value-notes"
            placeholder="Who referred you, when to follow up"
          ></textarea>
        </div>
      </form>

      <footer id="source" class="footer" hidden>
        <span id="source-name" class="source-name"></span>
        <span id="source-detail" class="source-detail"></span>
      </footer>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
